<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #000;
}

.shadow-glow {
  font-size: 72px;
  color: white;
  position: relative;
}

.shadow-glow::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  z-index: -1;
  background-image: linear-gradient(
    45deg,
    #ff0000,
    #800cec,
    #d220ff
  );
  background-size: 200% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: blur(20px);
  animation: shadowFlow 4s linear infinite;
}

@keyframes shadowFlow {
  0% { 
    background-position: 0% 50%;
    transform: scale(1.1);
  }
  50% { 
    background-position: 100% 50%;
    transform: scale(1.2);
  }
  100% { 
    background-position: 0% 50%;
    transform: scale(1.1);
  }
}
</style>
</head>
<body>
  <div class="shadow-glow" data-text="GLOW">GLOW</div>
</body>
</html>
