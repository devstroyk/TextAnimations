<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunset gradient</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #000;
      font-family: sans-serif;
    }

    .gradient-text {
      font-size: 64px;
      font-weight: bold;
      background-image: repeating-linear-gradient(
        90deg,
        #8A2BE2 0%,
        #DA70D6 16.6%,
        #FFA500 33.3%,
        #FFD700 50%,
        #00BFFF 66.6%,
        #FF69B4 83.3%,
        #8A2BE2 100%
      );
      background-size: 200% auto;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      animation: gradientScroll 6s linear infinite;
      text-shadow: 0 0 12px rgba(138,43,226,0.4);
    }

    @keyframes gradientScroll {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }
  </style>
</head>
<body>
  <span class="gradient-text">Sunset gradient</span>
</body>
</html>
