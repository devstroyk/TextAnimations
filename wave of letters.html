<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #000;
}

.wave-text {
  display: flex;
  gap: 5px;
  color: white;
}

.wave-text span {
  font-size: 48px;
  display: inline-block;
  animation: wave 1.2s ease-in-out infinite;
}

@keyframes wave {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

.wave-text span:nth-child(1) { animation-delay: 0.1s; }
.wave-text span:nth-child(2) { animation-delay: 0.2s; }
.wave-text span:nth-child(3) { animation-delay: 0.3s; }
.wave-text span:nth-child(4) { animation-delay: 0.4s; }
</style>
</head>
<body>
  <div class="wave-text">
    <span>W</span><span>A</span><span>V</span><span>E</span>
  </div>
</body>
</html>
