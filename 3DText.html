<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #000;
}

.rotate3d {
  font-size: 64px;
  color: white;
  perspective: 1000px;
  transition: transform 1s;
  cursor: pointer;
}

.rotate3d:hover {
  transform: rotateY(360deg);
}
</style>
</head>
<body>
  <div class="rotate3d">3D TEXT</div>
</body>
</html>
