<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #000;
}

.neon {
  font-size: 72px;
  color: #fff;
  text-shadow: 
    0 0 5px #fff,
    0 0 10px #fff,
    0 0 20px #ff00de,
    0 0 30px #ff00de;
  animation: neonPulse 1.5s ease-in-out infinite;
}

@keyframes neonPulse {
  0%, 100% { opacity: 0.8; }
  50% { opacity: 1; text-shadow: 
    0 0 10px #fff,
    0 0 20px #ff00de,
    0 0 30px #ff00de,
    0 0 40px #ff00de; }
}
</style>
</head>
<body>
  <div class="neon">NEON GLOW</div>
</body>
</html>
