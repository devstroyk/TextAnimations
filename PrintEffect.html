<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background: #000;
}

.typewriter {
  font-family: monospace;
  color: #00ff00;
  border-right: 3px solid;
  width: 0;
  overflow: hidden;
  white-space: nowrap;
  animation: 
    typing 3s steps(30) infinite, /* like fps, try more than 30*/
    cursor 0.7s step-end infinite;
}

@keyframes typing {
  from { width: 0 }
  to { width: 360px }
}

@keyframes cursor {
  from, to { border-color: transparent }
  50% { border-color: #00ff00; }
}
</style>
</head>
<body>
  <div class="typewriter">Hello, World!</div>
</body>
</html>
